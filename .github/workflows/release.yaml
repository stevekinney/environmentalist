name: release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-node writes the .npmrc (registry wiring) needed for OIDC trusted
      # publishing with provenance — no hand-rolled .npmrc, no NPM_TOKEN.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10.x; trusted publishing (OIDC) needs npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: bun run scripts/verify-release-version.ts

      # Runs the same gate `prepublishOnly` would, but up front, so a failure
      # surfaces before the publish attempt rather than inside it. This also
      # builds `dist/`, which the `--ignore-scripts` publish below relies on.
      - name: Validate
        run: bun run validate

      # `--ignore-scripts` because `validate` already ran the full gate and the
      # build. It also avoids a nested `npm pack` (from attw, via prepublishOnly)
      # running inside the outer publish lifecycle.
      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: npm publish --ignore-scripts
